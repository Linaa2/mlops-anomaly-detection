# ============================================================
# PROD — Streamlit Deployment + Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: mlops
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: IMAGE_WEBAPP
          ports:
            - containerPort: 8501
          env:
            - name: ENV
              value: "prod"
            - name: API_URL
              value: "http://api-service:80"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: mlops
spec:
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer
