# ============================================================
# Prometheus — Configuration scraping
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: dev

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:

  # Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI — métriques custom via /metrics
  - job_name: fastapi
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # Airflow
  - job_name: airflow
    static_configs:
      - targets: ["airflow-webserver:8080"]
    metrics_path: /metrics

  # MLflow
  - job_name: mlflow
    static_configs:
      - targets: ["mlflow:5000"]
    metrics_path: /metrics

  # Node exporter (system metrics)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
