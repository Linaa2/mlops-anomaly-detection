name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests and generate badges
        env:
          MLFLOW_TRACKING_URI: ./mlruns
        run: |
          uv run pytest \
            --cov=src --cov-branch --cov-fail-under=0 \
            --cov-report=xml \
            --junitxml=pytest-report.xml
          uv run python scripts/generate_badges.py \
            --coverage coverage.xml \
            --junit pytest-report.xml \
            --output badges

      - name: Build documentation
        run: uv run sphinx-build -b html docs/source docs/build/html

      - name: Inject badges into docs site
        run: |
          mkdir -p docs/build/html/badges
          cp badges/*.json docs/build/html/badges/

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
