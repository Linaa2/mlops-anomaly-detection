name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # build-push: désactivé — secrets DockerHub non configurés
  # deploy: désactivé — cluster K8s non configuré
  # À activer quand les secrets seront dans GitHub Actions
