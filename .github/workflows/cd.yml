# ============================================================
# CD Pipeline — Build → Push DockerHub → Deploy K8s
# Trigger : push sur main
# ============================================================
name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_API: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-api
  IMAGE_WEBAPP: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-webapp

jobs:

  # ── 1. Tests avant build ───────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # ── 2. Build & Push Docker images ─────────────────────────
  build-push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Webapp image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: webapp/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEBAPP }}:latest
            ${{ env.IMAGE_WEBAPP }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy sur K8s ─────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Create namespace if not exists
        run: kubectl get namespace mlops || kubectl create namespace mlops

      - name: Create/Update secrets
        run: |
          kubectl create secret generic mlops-secrets \
            --from-literal=MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} \
            --namespace mlops \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags
        run: |
          sed -i "s|mlops-api:latest|mlops-api:${{ needs.build-push.outputs.image_tag }}|g" k8s/api-deployment.yaml
          sed -i "s|mlops-webapp:latest|mlops-webapp:${{ needs.build-push.outputs.image_tag }}|g" k8s/webapp-deployment.yaml
          sed -i "s|\$DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s/api-deployment.yaml
          sed -i "s|\$DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s/webapp-deployment.yaml

      - name: Deploy to K8s
        run: |
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/webapp-deployment.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n mlops --timeout=120s
          kubectl rollout status deployment/webapp -n mlops --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n mlops
          kubectl get services -n mlops
