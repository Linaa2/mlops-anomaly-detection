# ============================================================
# CD Pipeline — Build → Push GHCR → Deploy K8s
# Trigger : push sur main
# Images  : api, webapp, airflow, mlflow (4 images → GHCR)
# ============================================================
name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DH_IMAGE_API: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-api
  DH_IMAGE_WEBAPP: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-webapp

jobs:

  # ── 1. Tests avant build ───────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        env:
          MLFLOW_TRACKING_URI: ./mlruns
        run: uv run pytest tests/ -v --tb=short

  # ── 2. Build & Push Docker images ─────────────────────────
  build-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image tag and lowercase owner
        id: meta
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mlops-api:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/mlops-api:${{ steps.meta.outputs.version }}
            ${{ env.DH_IMAGE_API }}:latest
            ${{ env.DH_IMAGE_API }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Webapp image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: webapp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mlops-webapp:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/mlops-webapp:${{ steps.meta.outputs.version }}
            ${{ env.DH_IMAGE_WEBAPP }}:latest
            ${{ env.DH_IMAGE_WEBAPP }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Airflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: airflow/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mlops-airflow:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/mlops-airflow:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push MLflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: mlflow/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mlops-mlflow:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/mlops-mlflow:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Check secrets disponibles ──────────────────────────
  check-deploy:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    needs: build-push
    outputs:
      has_kubeconfig: ${{ steps.check.outputs.has_kubeconfig }}
    steps:
      - id: check
        run: |
          if [ -n "$SECRET" ]; then
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          else
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
          fi
        env:
          SECRET: ${{ secrets.KUBECONFIG }}

  # ── 4. Deploy sur K8s ─────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-push, check-deploy]
    if: needs.check-deploy.outputs.has_kubeconfig == 'true'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Create namespace if not exists
        run: kubectl get namespace mlops || kubectl create namespace mlops

      - name: Create/Update secrets
        run: |
          kubectl create secret generic mlops-secrets \
            --from-literal=MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} \
            --from-literal=MLFLOW_MODEL_NAME=${{ secrets.MLFLOW_MODEL_NAME || 'HydraulicConditionModel' }} \
            --from-literal=MINIO_ENDPOINT_URL=${{ secrets.MINIO_ENDPOINT_URL }} \
            --from-literal=MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }} \
            --from-literal=MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }} \
            --namespace mlops \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags in manifests
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          sed -i "s|IMAGE_API|ghcr.io/${OWNER}/mlops-api:${{ needs.build-push.outputs.image_tag }}|g" k8s/api-deployment.yaml
          sed -i "s|IMAGE_WEBAPP|ghcr.io/${OWNER}/mlops-webapp:${{ needs.build-push.outputs.image_tag }}|g" k8s/webapp-deployment.yaml

      - name: Deploy to K8s
        run: |
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/webapp-deployment.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n mlops --timeout=120s
          kubectl rollout status deployment/webapp -n mlops --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n mlops
          kubectl get services -n mlops
