name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        env:
          MLFLOW_TRACKING_URI: ./mlruns
        run: |
          uv run pytest \
            --cov=src --cov-branch --cov-fail-under=0 \
            --cov-report=xml \
            --junitxml=pytest-report.xml

      - name: Generate badges
        run: python scripts/generate_badges.py --coverage coverage.xml --junit pytest-report.xml --output badges

      - name: Publish badges to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: badges
          destination_dir: badges
          keep_files: true

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Security scan — Bandit
        run: uv run bandit -r src/ -ll

      - name: Security scan — Safety
        run: uv run safety scan --short-report
        continue-on-error: true

  security-scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
