# ============================================================
# DEV ENVIRONMENT — Docker Compose
# Services : Airflow, MLflow, FastAPI, Streamlit, Monitoring
#
# Variables d'environnement : copier envs/.env.example → envs/.env.dev
# Le fichier est chargé automatiquement (required: false).
# Pour la substitution YAML : docker compose --env-file envs/.env.dev up
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file:
    - path: envs/.env.dev
      required: false
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    # AIRFLOW_FERNET_KEY: generate with `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth"
    PYTHONPATH: /opt/airflow
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./models:/opt/airflow/models
    - ./reports:/opt/airflow/reports
    - ./data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL (Airflow backend) ───────────────────────────
  postgres:
    image: postgres:15
    env_file:
      - path: envs/.env.dev
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      retries: 5
    ports:
      - "5432:5432"

  # ── MLflow Tracking Server ─────────────────────────────────
  # Artefacts stockés sur MinIO (S3-compatible) : modèles, métriques JSON
  # --serve-artifacts : MLflow proxie les artefacts → les clients n'ont pas besoin
  #   des credentials MinIO directement (seul ce service y accède).
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        pip install boto3 -q &&
        mlflow server \
          --backend-store-uri sqlite:////mlflow/mlflow.db \
          --artifacts-destination s3://${MINIO_BUCKET:-mlops}/mlflow \
          --serve-artifacts \
          --host 0.0.0.0 \
          --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://89.58.44.97:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    env_file:
      - path: envs/.env.dev
        required: false
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"

  # ── Airflow Init ───────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname Admin --role Admin --email admin@example.com
    restart: on-failure

  # ── Airflow Webserver ──────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # ── Airflow Scheduler ──────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  # ── FastAPI ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: envs/.env.dev
        required: false
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ENV: dev
      PYTHONUNBUFFERED: "1"
      METRICS_PATH: /app/reports/model_metrics.json
    volumes:
      - ./api:/app/api
      - ./src:/app/src
      - ./models:/app/models
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    restart: always

  # ── Streamlit ──────────────────────────────────────────────
  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    env_file:
      - path: envs/.env.dev
        required: false
    environment:
      API_URL: http://api:8000
      ENV: dev
    volumes:
      - ./webapp:/app/webapp
      - ./reports:/app/reports
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: always

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    env_file:
      - path: envs/.env.dev
        required: false
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    env_file:
      - path: envs/.env.dev
        required: false
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always

  # ── Node Exporter (system metrics) ────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    ports:
      - "9100:9100"
    restart: always

volumes:
  postgres_data:
  mlflow_data:
  grafana_data:
  airflow_logs:
